<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#261f1e" />
    <meta name="description" content="ふたりの3ヶ月を祝う、小さな記念ページ。" />
    <title>Happy 3 Months</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="celebration">
      <div class="mosaic" id="mosaic" aria-hidden="true"></div>
      <div class="shade" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>

      <section class="hero" aria-labelledby="celebrationTitle">
        <p class="eyebrow">HAPPY ANNIVERSARY</p>
        <div class="heart-mark" aria-hidden="true">♡</div>
        <h1 id="celebrationTitle">
          <span>付き合って</span>
          <strong>3ヶ月</strong>
        </h1>
        <p class="hero__message">
          いつもありがとう。<br />
          これからも、ふたりでたくさん笑おうね。
        </p>

        <button class="letter-button" id="openLetter" type="button">
          <span class="letter-button__icon" aria-hidden="true">
            <svg viewBox="0 0 32 24" role="img">
              <path d="M2 3h28v18H2zM2 4l14 10L30 4" />
            </svg>
          </span>
          お手紙をひらく
        </button>
      </section>

    </main>

    <dialog class="letter-dialog" id="letterDialog" aria-labelledby="letterTitle">
      <div class="letter-backdrop" data-close-letter></div>
      <article class="letter-paper">
        <button class="letter-close" type="button" data-close-letter aria-label="手紙を閉じる">×</button>

        <div class="letter-stamp" aria-hidden="true">♡</div>
        <p class="letter-date" id="letterDate">2026.09.20</p>
        <h2 id="letterTitle">大好きな君へ。</h2>

        <div class="letter-body">
          <p>付き合って3ヶ月。</p>
          <p>
            いつもそばにいてくれてありがとう。君と出会ってから、何気ない毎日が前よりずっと特別になりました。
          </p>
          <p>
            これからもたくさん笑って、いろんな場所に行って、ふたりだけの思い出を増やしていこうね。
          </p>
        </div>

        <p class="letter-sign">これからもよろしくね <span>♡</span></p>
        <button class="letter-finish" type="button" data-close-letter>思い出に戻る</button>
      </article>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
